<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Dashboard</title>
  <script src="dashboard.js" defer></script>
</head>
<body>
  <h1>Browser Dashboard</h1>
  <p>Enter your name and favorite website.</p>
  <form id="dashboard-form" name="dashboardForm">
    <input type="text" id="user-name" name="userName">
    <input type="text" id="favorite-website" name="favoriteWebsite">
    <button type="submit" id="submit-button" name="submitButton">Submit</button>
  </form>
  <section id="output"></section>
  <button type="button" id="back-button">Back</button>
  <button type="button" id="forward-button">Forward</button>
</body>
</html>
